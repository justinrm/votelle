[project]
name = "votelle-music"
version = "0.1.0"
description = "Offline data foundation for music preference research. Fixture results are not preference evidence."
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.scripts]
votelle-music = "votelle_music.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
