name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv 0.12.21 and CPython 3.11
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"
          python-version: "3.11"
          enable-cache: "false"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run the offline foundation checks
        run: |
          uv run python tests/fixtures/build.py --dest tests/fixtures/pilot --families 20
          uv run votelle-music validate --config configs/foundation.json
          uv run votelle-music split --config configs/foundation.json --output runs/split.json
          uv run pytest -q
